## Create XDG config dir and symlink there (recommended):
## mkdir -p "$HOME/.config/tmux" && ln -sf /home/anu/src/cygenv/.tmux.conf "$HOME/.config/tmux/tmux.conf"

set -g mouse on

# Split bindings (use prefix + key)
bind | split-window -h
bind - split-window -v

# Move between panes using Alt + arrow keys (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config"

# Vi copy mode
setw -g mode-keys vi

# Set prefix to Ctrl-Space
set -g prefix C-Space